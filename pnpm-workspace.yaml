packages:
  - 'packages/*'

# Security pins. These live here rather than under `pnpm` in package.json
# because pnpm has stopped reading that field, and a silently-empty override
# set both drops the pins and fails `--frozen-lockfile` against a lockfile
# that still records them.
overrides:
  vite@<6.4.2: ^6.4.2
  esbuild@<0.25.0: ^0.25.0
  # Transitive, and reachable only through Fastify's own tree — the direct
  # dependencies were bumped in package.json instead. Each is pinned to the
  # first patched version rather than to `latest`, so the override says what it
  # is for and stops mattering once the parent catches up. (A77)
  #
  # find-my-way is Fastify's router and 5.12.0 still resolved 9.6.0; fast-uri is
  # reached twice — 3.x through @fastify/ajv-compiler, 4.x through
  # fast-json-stringify; brace-expansion sits under @fastify/static's glob. A77's
  # three were denial-of-service advisories, which on a 512MB free-tier instance
  # is the class that actually matters. A88 raised both fast-uri floors and the
  # brace-expansion one: fastify 5.12.7 still allows 3.1.5 / 4.1.2, which carry
  # host-confusion and SSRF advisories, so bumping the parent was not enough.
  find-my-way@<9.7.0: ^9.7.0
  fast-uri@<3.1.9: ^3.1.9
  fast-uri@>=4.0.0 <4.2.3: ^4.2.3
  # **Exactly the advisory's range and not a character wider.** The first draft
  # of this said `>=2.0.0` on the reasoning that brace-expansion is one function
  # and majors are cheap. It is not: 5.x moved off a CommonJS default export, and
  # `minimatch@9` — which is nobody's dependency here but `@vitest/coverage-v8`'s
  # — does `brace_expansion_1.default(...)` and threw. Lint, typecheck, 738 unit
  # tests and all 12 Playwright specs passed with it broken, because the only
  # thing that walks a glob is the coverage reporter. Widening an override past
  # the advisory buys nothing and costs the packages that were never affected.
  brace-expansion@>=3.0.0 <5.0.12: ^5.0.12

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
