name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action errors out if it is set
      # alongside `packageManager` in package.json, and that pin is what keeps
      # CI, Render and a laptop on the pnpm that generated the lockfile.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # Frozen, like the deploy. A plain install quietly rewrites the lockfile
      # to match whatever config it can see, which is how a config mismatch
      # stayed green here and failed on Render.
      - run: pnpm install --frozen-lockfile

      - name: Build engine (required for downstream typecheck)
        run: pnpm --filter @sichuan-mahjong/engine build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (engine + server + client)
        run: |
          pnpm --filter @sichuan-mahjong/engine test
          pnpm --filter sichuan-mahjong test
          pnpm --filter @sichuan-mahjong/client test

      - name: Build server
        run: pnpm --filter sichuan-mahjong build

      - name: Build client
        # VITE_E2E includes the window.__e2e Playwright helpers (this build is
        # for testing only; release builds omit them).
        run: pnpm --filter @sichuan-mahjong/client build
        env:
          VITE_E2E: '1'

      - name: npm package smoke test
        run: node packages/server/dist/main.js --help

      - name: npx smoke test
        working-directory: packages/server
        run: node dist/main.js --help

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: pnpm e2e
