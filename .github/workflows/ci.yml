name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # All three on majors that target node24 natively. On v4 they still ran,
      # but the runner forced them onto Node 24 and annotated every job about it
      # — a warning that would become a failure whenever the runner stops
      # bridging. Bumped 2026-08-04.
      - uses: actions/checkout@v7

      # No `version:` here on purpose. The action errors out if it is set
      # alongside `packageManager` in package.json, and that pin is what keeps
      # CI, Render and a laptop on the pnpm that generated the lockfile. v6
      # still resolves pnpm from that field; what it added was pnpm 11 support.
      - uses: pnpm/action-setup@v6

      # `cache: pnpm` is not optional here and was not before. setup-node v5
      # started caching automatically by detecting the package manager, and v6
      # narrowed that automatic path to npm only — so for pnpm the explicit
      # input is the supported route, and stating it is what makes both of those
      # breaking changes irrelevant to this workflow.
      - uses: actions/setup-node@v7
        with:
          # 22, matching `engines.node` (>=22.5.0) and render.yaml's NODE_VERSION.
          # This is the runtime the service ships on, and it is deliberately not
          # tied to the node24 the actions above run *themselves* on — testing on
          # a version nobody deploys would be the mismatch, not the fix.
          node-version: '22'
          cache: pnpm

      # Frozen, like the deploy. A plain install quietly rewrites the lockfile
      # to match whatever config it can see, which is how a config mismatch
      # stayed green here and failed on Render.
      - run: pnpm install --frozen-lockfile

      - name: Build engine (required for downstream typecheck)
        run: pnpm --filter @sichuan-mahjong/engine build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (engine + server + client)
        run: |
          pnpm --filter @sichuan-mahjong/engine test
          pnpm --filter sichuan-mahjong test
          pnpm --filter @sichuan-mahjong/client test

      - name: Build server
        run: pnpm --filter sichuan-mahjong build

      - name: Build client
        # VITE_E2E includes the window.__e2e Playwright helpers (this build is
        # for testing only; release builds omit them).
        run: pnpm --filter @sichuan-mahjong/client build
        env:
          VITE_E2E: '1'

      - name: npm package smoke test
        run: node packages/server/dist/main.js --help

      - name: npx smoke test
        working-directory: packages/server
        run: node dist/main.js --help

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: pnpm e2e
